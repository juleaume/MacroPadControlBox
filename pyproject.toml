[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["padbox"]

[tool.setuptools.package-data]
padbox = ["py.typed"]

[project.scripts]
padbox = "padbox.__main__:main"

[project]
name = "padbox"
version = "2.0.0"
description = ""
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pyudev>=0.24.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "circuitpython-stubs",
    "adafruit-circuitpython-macropad",
    "adafruit-circuitpython-hid",
    "adafruit-circuitpython-display-shapes",
    "adafruit-circuitpython-display-text",
    "types-pyserial",
]

[tool.black]
line-length = 120
extend-exclude = '_?version.*\.py'
target-version = ["py313"]

[tool.mypy]
strict = true
exclude = '_?version.*\.py'
